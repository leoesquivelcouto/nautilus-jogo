<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--bg:#eceef1;--pn:#fff;--tx:#18202e;--mu:#667086;--bd:#d3d8e0;--ac:#0b7285;--er:#c2255c;--wn:#b35c00;--ok:#2b8a3e;--hd:#18202e;color-scheme:light}

*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}

button{cursor:pointer}button:hover{border-color:var(--ac)}button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
button.big{font-size:17px;padding:14px 26px;width:100%}button.d{color:var(--er)}

main{padding:14px;display:grid;gap:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.g2{grid-template-columns:minmax(280px,360px) 1fr;align-items:start}@media(max-width:800px){.g2{grid-template-columns:1fr}}
.pn{background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:12px}

label{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:5px 0;font-size:13px}label input,label select{width:120px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cd{background:var(--pn);border:2px solid var(--bd);border-radius:6px;padding:6px;font-size:12px;cursor:pointer}.cd.on{border-color:var(--ac)}
.cd img{width:100%;height:130px;object-fit:contain;background:repeating-conic-gradient(#8883 0 25%,#0000 0 50%) 0 0/12px 12px}
.cd b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cd small{color:var(--mu);display:block}
.t{display:inline-block;padding:0 6px;border-radius:9px;font-size:11px;border:1px solid currentColor}.ok{color:var(--ok)}.wn{color:var(--wn)}.er{color:var(--er)}
.msg{padding:8px 10px;border-left:4px solid;margin:6px 0;background:var(--bg);border-radius:4px}.msg.e{border-color:var(--er)}.msg.w{border-color:var(--wn)}.msg.i{border-color:var(--ac)}
canvas{background:#fff;box-shadow:0 2px 10px #0004;max-width:none}.sc{overflow:auto;max-height:78vh;background:#8f97a5;padding:12px;border-radius:8px}
.cats{display:flex;flex-direction:column;gap:3px}.cats button{text-align:left}.cats button.on{background:var(--ac);color:#fff}
small.h{color:var(--mu)}#toast{position:fixed;bottom:14px;right:14px;background:var(--hd);color:#fff;padding:10px 14px;border-radius:8px;max-width:420px;display:none;white-space:pre-wrap;z-index:9}
.drop{outline:3px dashed var(--ac);outline-offset:-6px}
</style></head><body>
<header><b>Card Print Studio</b><select id="ps" onchange="openP(this.value)"></select>
<button onclick="projAct('new')">Novo</button><button onclick="projAct('dup')">Duplicar</button><button onclick="projAct('ren')">Renomear</button><button onclick="projAct('del')">Excluir</button>
<button onclick="zipOut()">Backup ZIP</button><button onclick="$('#zi').click()">Abrir ZIP</button><input id="zi" type="file" accept=".zip" hidden onchange="zipIn(this.files[0]);this.value=''">
<button onclick="undo()">↶ Desfazer</button><button onclick="redo()">↷ Refazer</button><button onclick="runTests()">Testes</button>
<small id="sv" style="opacity:.7"></small><small id="stg" style="opacity:.7"></small></header>
<nav id="nv"></nav><main id="mn"></main><div id="toast"></div>
<input id="fi" type="file" accept="image/*,.zip" multiple hidden onchange="addFiles([...this.files]);this.value=''">
<input id="fd" type="file" webkitdirectory hidden onchange="addFiles([...this.files]);this.value=''">
<input id="fb" type="file" accept="image/*" multiple hidden onchange="addFiles([...this.files],true);this.value=''">
<script>
const $=(s)=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SZ={'Pôquer 63,5×88,9':[63.5,88.9],'Tarot 70×120':[70,120],'Bridge 57×89':[57,89],'Mini 41×63':[41,63]},PP={A4:[210,297],A3:[297,420],Letter:[215.9,279.4],'Ofício':[215.9,330.2],'Personalizado':null};
const DEF=()=>({paper:'A4',pw:210,ph:297,land:false,cw:63.5,ch:88.9,cols:0,rows:0,gx:2.5,gy:2.5,ml:7,mr:7,mt:7,mb:7,np:0,align:'c',rad:3,marks:true,contour:false,duplex:'long',dx:0,dy:0,dpi:300,order:'import',seed:7,fit:'cover',tol:2,ref:null,refW:63.5,back:null,expMode:'combined',expCats:[],ids:false,rotAll:0,rotBack:0,autoRot:false,catPage:false,label:false});
let P,B={},sel=new Set,curCat='all',tab='lib',side='front',pg=0,zoom=1,hist=[],fut=[],last='',lim=200,q='',TH={},st;
const snap=()=>JSON.stringify(P);
/* ---------- persistência (IndexedDB) ---------- */
const db=new Promise((ok,ko)=>{const r=indexedDB.open('cps',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>ok(r.result);r.onerror=ko});
const tx=async(m,f)=>{const d=await db;return new Promise((ok,ko)=>{const t=d.transaction('p',m),r=f(t.objectStore('p'));t.oncomplete=()=>ok(r.result);t.onerror=()=>ko(t.error)})};
const saveNow=()=>{const imgs={};for(const c of[...P.cards,...P.backs])if(B[c.id])imgs[c.id]=B[c.id];return tx('readwrite',s=>s.put({meta:P,imgs},P.id))};
const dirty=()=>{clearTimeout(st);$('#sv').textContent='salvando…';st=setTimeout(async()=>{try{await saveNow();$('#sv').textContent='salvo às '+new Date().toLocaleTimeString()}catch(e){$('#sv').textContent='ERRO ao salvar: '+e.message}est()},700)};
async function est(){if(navigator.storage?.estimate){const e=await navigator.storage.estimate();$('#stg').textContent=` · armazenamento ${(e.usage/1e6).toFixed(0)} de ~${(e.quota/1e6).toFixed(0)} MB`}}
const projs=async()=>(await tx('readonly',s=>s.getAll())).map(r=>({id:r.meta.id,name:r.meta.name}));
async function hdr(){const l=await projs();$('#ps').innerHTML=l.map(p=>`<option value="${p.id}" ${p.id===P.id?'selected':''}>${esc(p.name)}</option>`).join('')}
async function newP(name){P={id:uid(),name,cats:[],cards:[],backs:[],set:DEF()};B={};await saveNow();return P.id}
async function openP(id){const r=await tx('readonly',s=>s.get(id));P=r.meta;P.set={...DEF(),...P.set};B=r.imgs||{};sel.clear();hist=[];fut=[];last=snap();localStorage.setItem('cps.last',id);await hdr();render();est()}
async function projAct(a){if(a==='new'){const n=prompt('Nome do projeto:','Novo projeto');if(n){await newP(n);await openP(P.id)}}
 if(a==='dup'){await saveNow();const c=JSON.parse(snap());c.id=uid();c.name+=' (cópia)';P=c;await saveNow();await openP(c.id)}
 if(a==='ren'){const n=prompt('Novo nome:',P.name);if(n){P.name=n;await saveNow();await hdr()}}
 if(a==='del'&&confirm('Excluir o projeto "'+P.name+'" definitivamente? Faça backup antes.')){await tx('readwrite',s=>s.delete(P.id));let l=await projs();if(!l.length){await newP('Meu projeto');l=await projs()}await openP(l[0].id)}}
function change(){hist.push(last);if(hist.length>60)hist.shift();fut=[];last=snap();dirty();render()}
const undo=()=>{if(!hist.length)return;fut.push(snap());P=JSON.parse(hist.pop());last=snap();dirty();render()},redo=()=>{if(!fut.length)return;hist.push(snap());P=JSON.parse(fut.pop());last=snap();dirty();render()};
const U=(k,v)=>{P.set[k]=v;change()},toast=(t,ms=6000)=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e.t);e.t=setTimeout(()=>e.style.display='none',ms)};
/* ---------- geometria (compartilhada por prévia e PDF) ---------- */
function layout(s){const W=s.land?s.ph:s.pw,H=s.land?s.pw:s.ph,aw=W-s.ml-s.mr,ah=H-s.mt-s.mb,e=1e-6;
 const ac=Math.max(0,Math.floor((aw+s.gx)/(s.cw+s.gx)+e)),ar=Math.max(0,Math.floor((ah+s.gy)/(s.ch+s.gy)+e)),cols=s.cols||ac,rows=s.rows||ar;
 const tw=cols*s.cw+(cols-1)*s.gx,th=rows*s.ch+(rows-1)*s.gy,fits=cols>0&&rows>0&&tw<=aw+e&&th<=ah+e&&s.gx>=0&&s.gy>=0;
 return{W,H,aw,ah,ac,ar,cols,rows,tw,th,fits,per:fits?cols*rows:0,ox:s.align==='c'?s.ml+(aw-tw)/2:s.ml,oy:s.align==='c'?s.mt+(ah-th)/2:s.mt}}
function rnd(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function items(){const s=P.set;let c=P.cards.filter(k=>!s.expCats.length||s.expCats.includes(k.cat));
 if(s.order==='name')c=[...c].sort((a,b)=>a.name.localeCompare(b.name,'pt',{numeric:true}));
 if(s.order==='cat'){const o=['',...P.cats.map(x=>x.id)];c=[...c].sort((a,b)=>o.indexOf(a.cat)-o.indexOf(b.cat))}
 const out=[],shuf=a=>{const r=rnd(s.seed);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}};for(const k of c)for(let i=0;i<k.copies;i++)out.push(k);
 if(s.catPage){const per=layout(s).per||1,res=[];for(const id of['',...P.cats.map(x=>x.id)]){const g=out.filter(k=>k.cat===id);if(!g.length)continue;if(s.order==='random')shuf(g);res.push(...g);while(res.length%per)res.push(null)}return res}
 if(s.order==='random')shuf(out);return out}
function backOf(k){const c=P.cats.find(x=>x.id===k.cat);let v=k.back!==undefined?k.back:(c&&c.back!==undefined?c.back:P.set.back);return!v||v==='none'||!B[v]||!P.backs.some(b=>b.id===v)?null:v}
const dim=(id,r)=>r%180?[B[id].h,B[id].w]:[B[id].w,B[id].h];
function effRot(id,r0){let r=((r0%360)+360)%360;if(P.set.autoRot&&B[id]){const[w,h]=dim(id,r);if(w!==h&&(w>h)!==(P.set.cw>P.set.ch))r=(r+90)%360}return r}
const rotFront=k=>effRot(k.id,(k.rot||0)+P.set.rotAll),rotBack=id=>effRot(id,(P.backs.find(b=>b.id===id)?.rot||0)+P.set.rotBack);
const pageCat=(p,it)=>{const n=layout(P.set).per,k=it.slice(p*n,(p+1)*n).find(Boolean);return k?(P.cats.find(c=>c.id===k.cat)?.name||'Sem categoria'):''};
function slots(p,sd,cal){const s=P.set,L=layout(s),it=cal?Array.from({length:L.per},(_,i)=>({cal:1,id:'c'+i})):items(),out=[];if(!L.fits)return out;
 const mx=(s.duplex!=='short')===(L.W<L.H);
 for(let i=0;i<L.per;i++){const k=it[p*L.per+i];if(k===undefined)break;if(k===null)continue;let r=Math.floor(i/L.cols),c=i%L.cols,img=k.id;
  if(sd==='back'){img=k.cal?'cal':backOf(k);if(mx)c=L.cols-1-c;else r=L.rows-1-r}
  out.push({k,i,n:p*L.per+i+1,r,c,img,rot:k.cal||!img?0:sd==='back'?rotBack(img):rotFront(k),x:L.ox+c*(s.cw+s.gx)+(sd==='back'?s.dx:0),y:L.oy+r*(s.ch+s.gy)+(sd==='back'?s.dy:0)})}return out}
function fitRect(iw,ih,x,y,w,h,f){let dw=w,dh=h;if(f==='cover'){const k=Math.max(w/iw,h/ih);dw=iw*k;dh=ih*k}else if(f==='contain'){const k=Math.min(w/iw,h/ih);dw=iw*k;dh=ih*k}return[x+(w-dw)/2,y+(h-dh)/2,dw,dh]}
function mk(x,y,w,h,ln){const o=.5,l=2.5;for(const[cx,sx]of[[x,-1],[x+w,1]])for(const[cy,sy]of[[y,-1],[y+h,1]]){ln(cx+sx*o,cy,cx+sx*(o+l),cy);ln(cx,cy+sy*o,cx,cy+sy*(o+l))}}
const effFit=k=>k.fit||P.set.fit;
function dpiOf(k,s){const[iw,ih]=dim(k.id,rotFront(k)),[,,dw,dh]=fitRect(iw,ih,0,0,s.cw,s.ch,effFit(k));return Math.min(iw/dw,ih/dh)*25.4}
function diag(k){const s=P.set,ref=P.cards.find(c=>c.id===s.ref&&B[c.id]),R=ref?dim(ref.id,rotFront(ref)):[s.cw,s.ch],tr=R[0]/R[1],[w,h]=dim(k.id,rotFront(k)),d=(w/h/tr-1)*100,a=Math.abs(d),dpi=dpiOf(k,s),o={d,dpi,prop:a>s.tol,low:dpi<s.dpi,t:'Compatível',c:'ok'};
 if(o.prop){const f=effFit(k);o.t=(Math.abs(h/w/tr-1)*100<=s.tol?'Parece girada (use Girar) · ':'')+(f==='cover'?'Necessita de corte':f==='contain'?'Ajustar enquadramento (sobram bordas)':'Será distorcida')+` · Δ${d.toFixed(1)}%`;o.c='wn';if(a>25){o.c='er';o.t='Revisão manual recomendada · Δ'+d.toFixed(1)+'%'}}
 else if(o.low){o.t=`Resolução insuficiente (${Math.round(dpi)} DPI)`;o.c='wn'}return o}
/* ---------- verificação ---------- */
function checks(){const s=P.set,L=layout(s),o=[],it=items().filter(Boolean),add=(l,m,f,fl)=>o.push({l,m,f,fl});
 if(!P.cards.length)add('e','Nenhuma carta importada.');else if(!it.length)add('e','Nenhuma carta na seleção de exportação (ou todas com 0 cópias).');
 if(!L.fits)add('e',`As cartas não cabem: ${L.cols}×${L.rows} precisam de ${L.tw.toFixed(1)}×${L.th.toFixed(1)} mm e a área útil é ${L.aw.toFixed(1)}×${L.ah.toFixed(1)} mm (ou espaçamento negativo). O software não reduz as cartas sozinho.`,'Usar distribuição automática','auto');
 if(s.rad>Math.min(s.cw,s.ch)/2)add('e','O raio dos cantos é maior que metade do menor lado da carta.','Limitar raio','rad');
 if(s.marks&&(s.gx<2.5||s.gy<2.5||Math.min(s.ml,s.mr,s.mt,s.mb)<2.5))add('w','As marcas de corte (3 mm) cruzam a arte ou saem da folha: use espaçamento e margens ≥ 2,5 mm.','Ajustar para 2,5 mm','gap');
 if(Math.min(s.ml,s.mr,s.mt,s.mb)<s.np)add('w',`Margens menores que a área não imprimível informada (${s.np} mm).`);
 const dg=P.cards.map(k=>[k,diag(k)]),pr=dg.filter(x=>x[1].prop).map(x=>x[0]),lo=dg.filter(x=>!x[1].prop&&x[1].low).map(x=>x[0]);
 if(pr.length)add('w',`${pr.length} carta(s) com proporção diferente (tolerância ${s.tol}%): ${pr.slice(0,4).map(k=>k.name).join(', ')}${pr.length>4?'…':''}. Serão cortadas/distorcidas conforme o enquadramento (ou gire-as, se estiverem deitadas).`,'Aplicar "cobrir" às divergentes','fit');
 if(lo.length)add('w',`${lo.length} imagem(ns) abaixo de ${s.dpi} DPI efetivos: ${lo.slice(0,4).map(k=>k.name).join(', ')}${lo.length>4?'…':''}. A qualidade não pode ser recuperada.`);
 const rf=P.cards.find(c=>c.id===s.ref&&B[c.id]);if(rf){const[a,b]=dim(rf.id,rotFront(rf));if(Math.abs(a/b/(s.cw/s.ch)-1)*100>s.tol)add('w','O tamanho físico atual da carta não tem a proporção da referência: aplique o tamanho da referência na aba Layout.')}
 if(s.duplex!=='none'){const nb=it.filter(k=>!backOf(k));if(nb.length)add('w',`${new Set(nb).size} carta(s) sem verso associado: a posição ficará vazia no verso.`);
  for(const id of new Set(it.map(backOf).filter(Boolean))){const[bw,bh]=dim(id,rotBack(id));if(Math.abs(bw/bh/(s.cw/s.ch)-1)*100>s.tol)add('w','Um verso tem proporção diferente do tamanho da carta e será enquadrado.')}
  add('i','Duplex: imprima primeiro a folha de teste de registro. O alinhamento digital não elimina a folga mecânica da impressora; use o ajuste X/Y do verso.')}
 const nm={};P.cards.forEach(k=>nm[k.name]=(nm[k.name]||0)+1);const dup=Object.keys(nm).filter(n=>nm[n]>1);if(dup.length)add('i',`Nomes repetidos: ${dup.slice(0,5).join(', ')}.`);
 return o}
function fix(a){const s=P.set;if(a==='auto'){s.cols=0;s.rows=0}if(a==='rad')s.rad=Math.min(s.cw,s.ch)/2;if(a==='gap'){s.gx=Math.max(s.gx,2.5);s.gy=Math.max(s.gy,2.5);for(const m of['ml','mr','mt','mb'])s[m]=Math.max(s[m],2.5)}if(a==='fit')P.cards.forEach(k=>{if(diag(k).prop)k.fit='cover'});change()}
/* ---------- importação ---------- */
const EXT=/\.(png|jpe?g|webp|gif|bmp|avif)$/i,MT={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',gif:'image/gif',bmp:'image/bmp',avif:'image/avif'};
async function mkThumb(bm){const k=Math.min(1,240/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.max(1,bm.width*k|0);c.height=Math.max(1,bm.height*k|0);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return c.toDataURL('image/webp',.85)}
async function addFiles(fs,isBack){const L=[],bad=[];for(const f of fs){if(/\.zip$/i.test(f.name)){try{const z=await JSZip.loadAsync(f);for(const[n,e]of Object.entries(z.files))if(!e.dir&&EXT.test(n)&&!/__MACOSX/.test(n))L.push(new File([await e.async('blob')],n.split('/').pop(),{type:MT[n.split('.').pop().toLowerCase()]}))}catch{bad.push(f.name)}}else if(f.type.startsWith('image/')||EXT.test(f.name))L.push(f);else bad.push(f.name)}
 let n=0;const pre=snap();for(const f of L){toast(`Importando ${++n}/${L.length}: ${f.name}`,60000);try{const bm=await createImageBitmap(f),b0=await createImageBitmap(f,{imageOrientation:'none'}).catch(()=>bm),id=uid();
  B[id]={blob:f,thumb:await mkThumb(bm),w:bm.width,h:bm.height,re:b0.width!==bm.width||b0.height!==bm.height};
  const nm=f.name.replace(/\.[^.]+$/,'');if(isBack)P.backs.push({id,name:nm});else P.cards.push({id,name:nm,cat:curCat==='all'?'':curCat,copies:1,fit:undefined,back:undefined});bm.close?.();b0.close?.()}catch{bad.push(f.name)}}
 hist.push(pre);fut=[];last=snap();dirty();render();toast(`${L.length-bad.filter(x=>L.some(f=>f.name===x)).length} imagem(ns) importada(s) sem alterar os originais.`+(bad.length?`\nNão importados (corrompidos/não suportados): ${bad.join(', ')}`:''),9000)}
addEventListener('paste',e=>{const f=[...(e.clipboardData?.files||[])].filter(x=>x.type.startsWith('image/'));if(f.length)addFiles(f.map((x,i)=>new File([x],'colada-'+Date.now()+i+'.png',{type:x.type})))});
addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('drop')});addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('drop')});
addEventListener('drop',async e=>{e.preventDefault();document.body.classList.remove('drop');const fs=[];const walk=async en=>{if(en.isFile)fs.push(await new Promise(r=>en.file(r)));else if(en.isDirectory){const rd=en.createReader();let b;do{b=await new Promise(r=>rd.readEntries(r));for(const x of b)await walk(x)}while(b.length)}};
