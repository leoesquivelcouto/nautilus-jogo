<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nautilus</title>
  <meta name="description" content="Nautilus: jogo de tabuleiro pirata contra bots. Pesque, saqueie baús, compre artefatos e sobreviva à Maré Negra.">
  <meta name="theme-color" content="#06141a">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta property="og:title" content="Nautilus">
  <meta property="og:description" content="Jogo de tabuleiro pirata: pesque, saqueie, compre artefatos e sobreviva à Maré Negra.">
  <meta property="og:type" content="website">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-compass" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="1.5 3.2"/>
      <path d="M50 20 L54 46 L80 50 L54 54 L50 80 L46 54 L20 50 L46 46 Z" fill="currentColor" opacity=".5" transform="rotate(45 50 50)"/>
      <path d="M50 4 L57 43 L96 50 L57 57 L50 96 L43 57 L4 50 L43 43 Z" fill="currentColor"/>
      <path d="M50 4 L57 43 L50 50 Z M96 50 L57 57 L50 50 Z M50 96 L43 57 L50 50 Z M4 50 L43 43 L50 50 Z" fill="#000" opacity=".3"/>
      <circle cx="50" cy="50" r="5" fill="currentColor"/><circle cx="50" cy="50" r="2.2" fill="#000" opacity=".5"/>
    </symbol>
    <symbol id="i-swords" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M8 8 L34 34 M30 38 L38 30 M36 36 L42 42"/><path d="M40 8 L14 34 M18 38 L10 30 M12 36 L6 42"/></g></symbol>
    <symbol id="i-orn" viewBox="0 0 420 14"><g fill="none" stroke="currentColor" stroke-width="1.2"><path d="M0 7 H170 M250 7 H420"/><path d="M175 7 C185 0 195 0 210 7 C225 14 235 14 245 7 C235 0 225 0 210 7 C195 14 185 14 175 7 Z"/></g><circle cx="210" cy="7" r="2.6" fill="currentColor"/></symbol>
    <symbol id="i-cross" viewBox="0 0 24 24"><path d="M10 3h4v5h5v4h-5v9h-4v-9H5V8h5z" fill="currentColor"/></symbol>
    <symbol id="i-skull" viewBox="0 0 24 24"><path d="M12 2C7 2 4 5.5 4 10c0 2.6 1.2 4.4 3 5.5V19h2v-2h2v2h2v-2h2v2h2v-3.5c1.8-1.1 3-2.9 3-5.5 0-4.5-3-8-8-8zM8.5 13a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm7 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4z" fill="currentColor"/></symbol>
  </defs>
</svg>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><svg aria-hidden="true"><use href="#i-compass"/></svg><span class="foil">NAUTILUS</span></div>
    <div class="roundbox"><div class="round">Rodada <b id="roundN" class="tab">1</b></div><div class="mare" id="mare" title="Maré Negra: na última casa, todos viram esqueletos"></div></div>
    <div class="era pir" id="era">Era das Ilhas</div>
    <div class="turnpill" id="turnpill"></div>
    <div class="tools">
      <select class="inp" id="speedSel" title="Velocidade dos bots" aria-label="Velocidade dos bots">
        <option value="1200">Bots: lentos</option><option value="650" selected>Bots: normais</option><option value="250">Bots: rápidos</option><option value="0">Bots: instantâneos</option>
      </select>
      <div class="popwrap"><button class="btn small" id="soundBtn" aria-haspopup="true" aria-expanded="false" title="Som e animações">Som</button><div class="pop" id="soundPop" hidden></div></div>
      <button class="btn small" id="testBtn" title="Mostra mãos e baralhos dos bots">Modo teste</button>
      <button class="btn small" id="auxBtn" title="Carta de auxílio: preços de todos os locais (C)">Preços</button>
      <button class="btn small" id="helpBtn" title="Manual do jogo (?)">Manual</button>
      <button class="btn small" id="menuBtn">Nova partida</button>
    </div>
  </header>
  <main class="game">
    <section class="boardwrap" id="boardwrap">
      <svg id="board" viewBox="0 0 1700.79 1370.43" role="img" aria-label="Tabuleiro do Nautilus"></svg>
      <div class="tip" id="tip" hidden></div>
      <div class="toasts" id="toasts"></div>
      <div class="zoomctl" aria-label="Zoom do mapa"><button class="btn" id="zIn" title="Aproximar (+)" aria-label="Aproximar">+</button><button class="btn" id="zOut" title="Afastar (−)" aria-label="Afastar">−</button><button class="btn" id="zFit" title="Enquadrar o mapa (0)" aria-label="Enquadrar o mapa">⤢</button></div>
    </section>
    <aside class="side" id="side"></aside>
  </main>
</div>
<div id="setup" class="setup" hidden></div>
<div id="modalRoot"></div>
<div id="live" class="sr" aria-live="polite"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
